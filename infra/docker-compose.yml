services:
  nessie:
    image: ghcr.io/projectnessie/nessie:0.103.3
    container_name: novalake-nessie
    environment:
      # Module 3 intentionally keeps Nessie ephemeral for local reproducibility.
      nessie.version.store.type: IN_MEMORY
      quarkus.http.host: 0.0.0.0
    ports:
      - "19120:19120"

  postgres:
    image: postgres:16
    container_name: novalake-postgres
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql/postgres_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: novalake-minio
    env_file:
      - ../.env
    environment:
      MINIO_ROOT_USER: ${NOVALAKE_S3_ACCESS_KEY:?NOVALAKE_S3_ACCESS_KEY is required in .env}
      MINIO_ROOT_PASSWORD: ${NOVALAKE_S3_SECRET_KEY:?NOVALAKE_S3_SECRET_KEY is required in .env}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    container_name: novalake-minio-init
    env_file:
      - ../.env
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set novalake http://minio:9000 $$NOVALAKE_S3_ACCESS_KEY $$NOVALAKE_S3_SECRET_KEY; do
        sleep 2;
      done;
      mc mb --ignore-existing novalake/$$NOVALAKE_S3_BUCKET;
      mc anonymous set private novalake/$$NOVALAKE_S3_BUCKET;
      "

  spark-master:
    build:
      context: ..
      dockerfile: infra/spark/Dockerfile
    image: novalake/spark-iceberg:3.5.1
    container_name: novalake-spark-master
    env_file:
      - ../.env
    depends_on:
      - minio-init
      - nessie
    environment:
      PYTHONPATH: /opt/novalake
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.master.Master",
        "--host",
        "spark-master",
        "--port",
        "7077",
        "--webui-port",
        "8080"
      ]
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ../:/opt/novalake
    working_dir: /opt/novalake

  spark-worker:
    image: novalake/spark-iceberg:3.5.1
    container_name: novalake-spark-worker
    env_file:
      - ../.env
    depends_on:
      - spark-master
      - minio-init
      - nessie
    environment:
      PYTHONPATH: /opt/novalake
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark-master:7077",
        "--webui-port",
        "8081"
      ]
    ports:
      - "8081:8081"
    volumes:
      - ../:/opt/novalake
    working_dir: /opt/novalake

  notebook-lab:
    build:
      context: ..
      dockerfile: infra/lab/Dockerfile
    image: novalake/notebook-lab:3.5.1
    container_name: novalake-notebook-lab
    profiles: ["lab"]
    env_file:
      - ../.env
    depends_on:
      - spark-master
      - spark-worker
      - minio-init
      - nessie
    environment:
      PYTHONPATH: /opt/novalake
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    entrypoint:
      - /bin/bash
      - /opt/novalake/scripts/start_notebook_lab.sh
    ports:
      - "8888:8888"
    volumes:
      - ../:/opt/novalake
    working_dir: /opt/novalake

volumes:
  postgres_data:
  minio_data:
